name: CICD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "Flagsweep.sln"
      - "Directory.Build.props"
      - ".config/**"
      - ".csharpierignore"
      - ".editorconfig"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.test.yml"
      - ".github/workflows/cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "Flagsweep.sln"
      - "Directory.Build.props"
      - ".config/**"
      - ".csharpierignore"
      - ".editorconfig"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.test.yml"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    name: Build & Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
        env:
          AZURE_APPCONFIG_CONNECTION_STRING: ${{ github.event_name != 'pull_request' && secrets.AZURE_APPCONFIG_CONNECTION_STRING || '' }}

  type-check-web:
    name: Type-check Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/web

      - name: TypeScript type check
        run: npm run typecheck
        working-directory: src/web

      - name: Lint
        run: npm run lint
        working-directory: src/web

      - name: Unit tests
        run: npm test
        working-directory: src/web

      - name: Dead code check
        run: npm run knip
        working-directory: src/web

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build-api, type-check-web]
    steps:
      - uses: actions/checkout@v4

      - name: Run e2e tests via Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up e2e \
            --build \
            --abort-on-container-exit \
            --exit-code-from e2e
        timeout-minutes: 10

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/reports/report.html
          retention-days: 7

  image:
    name: Build & publish image
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and push policy
        id: cfg
        env:
          REPO: ${{ github.repository }}
        run: |
          # ghcr.io requires a lowercase image path.
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          # Assembly version stamped into the build: the tag's semver, else 0.0.0.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cfg.outputs.image }}
          tags: |
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Flagsweep
            org.opencontainers.image.description=FeatureOps on top of the feature flags in your cloud.

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.cfg.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: steps.cfg.outputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.cfg.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Take everything under "## [X.Y.Z]" up to the next "## [" heading
          # or the link reference definitions at the end of the file.
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && (/^## \[/ || /^\[/) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "No CHANGELOG.md section for ${VERSION#v}; rename [Unreleased] before tagging." >&2
            exit 1
          fi
          {
            echo
            echo "**Image:** \`ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION#v}\`"
          } >> notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          discussion_category_name: Announcements
