<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Figtree,system-ui,sans-serif;background:#fdfbf9;color:#1c1b22;position:relative;-webkit-font-smoothing:antialiased}
  .glow{position:absolute;inset:0;background:
    radial-gradient(60% 70% at 88% 12%, rgba(242,96,122,.28), transparent 60%),
    radial-gradient(45% 55% at 10% 95%, rgba(242,96,122,.16), transparent 60%)}
  .wrap{position:relative;padding:72px 84px;height:630px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:20px}
  .brand svg{width:64px;height:64px}
  .brand span{font-weight:800;font-size:40px;letter-spacing:-.02em}
  h1{font-size:74px;line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:0;max-width:980px}
  h1 em{font-style:normal;color:#d64a63}
  .sub{font-size:28px;color:#3d3b47;font-weight:500;margin:0}
  .chips{display:flex;gap:14px}
  .chip{font-weight:700;font-size:20px;padding:10px 18px;border-radius:999px;background:#fde7ec;color:#c2364e}
</style></head><body><div class="glow"></div><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#f2607a"/><rect x="14" y="26" width="36" height="16" rx="8" fill="#fdfbf9" opacity="0.35"/><circle cx="42" cy="34" r="8" fill="#fdfbf9"/></svg>
    <span>Flagsweep</span>
  </div>
  <div>
    <h1><em>FeatureOps</em> on top of the feature flags in your cloud.</h1>
    <p class="sub" style="margin-top:26px">Audit trail with the actor, drift detection, locks, owners and retire-by dates for the flags in your cloud's store.</p>
  </div>
  <div class="chips"><span class="chip">Self-hosted</span><span class="chip">Open source · Apache-2.0</span><span class="chip">Azure App Configuration</span><span class="chip">AWS AppConfig soon</span></div>
</div></body></html>
